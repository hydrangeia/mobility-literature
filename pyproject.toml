[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mobility-literature"
version = "0.1.0"
description = "Traceable carrier-mobility literature discovery and data import"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
mobility-literature = "mobility_literature.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
